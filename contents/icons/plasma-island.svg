<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252730"/>
      <stop offset="100%" stop-color="#121318"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15161c"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded App Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Violet Ambient Glow Behind Island -->
  <ellipse cx="128" cy="118" rx="76" ry="30" fill="#8b5cf6" opacity="0.22"/>

  <!-- Main Dynamic Island Capsule -->
  <rect x="36" y="88" width="184" height="56" rx="28" fill="url(#pillGrad)" stroke="url(#waveGrad)" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Left Album/Clock Accent Circle -->
  <rect x="52" y="102" width="28" height="28" rx="9" fill="url(#waveGrad)" opacity="0.92"/>
  <circle cx="66" cy="116" r="5" fill="#ffffff" opacity="0.9"/>

  <!-- Center Mirrored Soundwave Silhouette -->
  <path d="M 94 116
           C 100 116, 102 107, 106 107
           C 110 107, 111 113, 115 113
           C 119 113, 122 98, 128 98
           C 134 98, 137 113, 141 113
           C 145 113, 146 107, 150 107
           C 154 107, 156 116, 162 116
           C 156 116, 154 125, 150 125
           C 146 125, 145 119, 141 119
           C 137 119, 134 134, 128 134
           C 122 134, 119 119, 115 119
           C 111 119, 110 125, 106 125
           C 102 125, 100 116, 94 116 Z"
        fill="url(#waveGrad)"/>

  <!-- Right Status Indicator Dots -->
  <circle cx="180" cy="116" r="5.5" fill="#4ade80"/>
  <circle cx="198" cy="116" r="5.5" fill="#ffffff" opacity="0.75"/>

  <!-- Minimal Bottom Workspace Indicator Dots -->
  <rect x="98" y="164" width="22" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="133" cy="169" r="5" fill="#ffffff" opacity="0.28"/>
  <circle cx="151" cy="169" r="5" fill="#ffffff" opacity="0.28"/>
</svg>
